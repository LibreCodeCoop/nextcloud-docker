name: Build and publish maintained Nextcloud images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * 2'

permissions:
  contents: read

concurrency:
  group: nextcloud-stable-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/librecodecoop/nextcloud-docker-app
  WEB_IMAGE: ghcr.io/librecodecoop/nextcloud-docker-web

jobs:
  script-tests:
    name: Test version and publication scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run offline regression tests
        run: make test-ci-scripts

      - name: Test Trivy wrapper
        run: bash tests/test-scan-images.sh

      - name: ShellCheck image publication scripts
        run: |
          shellcheck scripts/nextcloud-versions.sh scripts/publish-images.sh \
            scripts/publish-manifest.sh scripts/push-architecture.sh \
            scripts/publish-master-manifest.sh scripts/push-master-architecture.sh

  versions:
    needs: script-tests
    name: Load approved Nextcloud releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.approved.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate reviewed manifest and emit matrix
        id: approved
        run: bash scripts/nextcloud-versions.sh matrix --github-output "$GITHUB_OUTPUT"

  app:
    name: app ${{ matrix.tag }}
    needs: [script-tests, versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, scan, and test Nextcloud app
        uses: ./.github/actions/build-and-scan
        with:
          component: app
          nextcloud_version: ${{ matrix.release }}-fpm

      - name: Upload amd64 security findings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/app-linux-amd64.sarif
          category: trivy-app-linux-amd64-${{ matrix.tag }}

      - name: Upload arm64 security findings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/app-linux-arm64.sarif
          category: trivy-app-linux-arm64-${{ matrix.tag }}

      - name: Save vulnerability reports
        uses: actions/upload-artifact@v7
        with:
          name: trivy-app-${{ matrix.tag }}
          path: trivy-results/*.sarif
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage validated architectures
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/publish-images.sh stage-app "$APP_IMAGE" "$GITHUB_SHA" "${{ matrix.tag }}"

  web:
    name: web runtime
    needs: script-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and scan web image once
        uses: ./.github/actions/build-and-scan
        with:
          component: web

      - name: Upload amd64 security findings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/web-linux-amd64.sarif
          category: trivy-web-linux-amd64

      - name: Upload arm64 security findings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/web-linux-arm64.sarif
          category: trivy-web-linux-arm64

      - name: Save vulnerability reports
        uses: actions/upload-artifact@v7
        with:
          name: trivy-web
          path: trivy-results/*.sarif
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage validated web architectures
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/publish-images.sh stage-web "$WEB_IMAGE" "$GITHUB_SHA"

  promote:
    name: Publish versioned manifests and moving aliases
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [script-tests, versions, app, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish approved images and aliases
        run: bash scripts/publish-images.sh promote "$APP_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" .github/nextcloud-supported.json
