name: Build Nextcloud Main Development Image

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  push:
    branches:
      - main
    paths:
      - .docker/app/Dockerfile.daily
      - .docker/app/config/**
      - .docker/dev-worker/**
      - .github/workflows/nextcloud-main-development.yml

concurrency:
  group: nextcloud-main-development
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ${{ github.repository }}-app
  DEV_IMAGE: ${{ github.repository }}-dev-worker

jobs:
  build:
    name: Build and push main development images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main app image
        uses: docker/build-push-action@v6
        with:
          context: .docker/app
          file: .docker/app/Dockerfile.daily
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXTCLOUD_DAILY_URL=https://download.nextcloud.com/server/daily/latest-master.tar.bz2
          tags: ${{ env.REGISTRY }}/${{ env.APP_IMAGE }}:main
          cache-from: type=gha,scope=nextcloud-main-development
          cache-to: type=gha,mode=max,scope=nextcloud-main-development

      - name: Build and push main development worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/dev-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NCDD_APP_IMAGE=${{ env.REGISTRY }}/${{ env.APP_IMAGE }}:main
          tags: ${{ env.REGISTRY }}/${{ env.DEV_IMAGE }}:main
          cache-from: type=gha,scope=ncdd-main-worker
          cache-to: type=gha,mode=max,scope=ncdd-main-worker
