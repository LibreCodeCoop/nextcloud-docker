name: Build and Push Docker Image

# One lifecycle for the runtime images: build -> scan -> boot test -> publish.
#
# Triggers:
#   * pull_request: build + scan + boot test, nothing is published
#   * push to main: build + scan + boot test + publish
#   * weekly schedule: rebuild + scan + boot test + publish, so the published
#     images pick up distribution security fixes without a code change
#
# Scheduled runs deliberately do NOT rewrite `sha-<commit>` tags: those are
# immutable by contract (see docs/images.md). They use internal `build-*` tags
# for the per-architecture manifests and only refresh the rolling tags.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Shared build metadata: one place that resolves the Nextcloud version, the
  # image naming rules and the traceability values used by every build channel.
  meta:
    runs-on: ubuntu-latest
    outputs:
      nextcloud_version: ${{ steps.version.outputs.value }}
      nextcloud_major: ${{ steps.version.outputs.major }}
      repo_name: ${{ steps.repo_name.outputs.value }}
      per_arch_prefix: ${{ steps.tags.outputs.per_arch_prefix }}
      immutable_tag: ${{ steps.tags.outputs.immutable_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Nextcloud version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^NEXTCLOUD_VERSION=' .env.example | cut -d= -f2-)
          if [ -z "$version" ]; then
            echo "NEXTCLOUD_VERSION is missing from .env.example" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # "34-fpm" -> "34"; rolling tags such as "stable-fpm" have no major.
          case "$version" in
            [0-9]*) echo "major=${version%%-*}" >> "$GITHUB_OUTPUT" ;;
            *)      echo "major=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Normalize repository name
        id: repo_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # A scheduled rebuild re-reads the distribution repositories, so it
            # produces a different image for the same commit. Publishing that as
            # `sha-<commit>` would break the documented immutability contract,
            # so scheduled runs get internal per-architecture tags and only
            # refresh the rolling tags.
            echo "per_arch_prefix=build-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "immutable_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "per_arch_prefix=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "immutable_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # A green build only proves an image compiles. This boots the real stack
  # (postgres + app + web) and asserts Nextcloud installs, `occ status` reports
  # it, the HTTP front-end answers and the traceability labels are present.
  # `publish` only runs when this passes.
  smoke:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        env:
          NEXTCLOUD_VERSION: ${{ needs.meta.outputs.nextcloud_version }}
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
          EVENT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          {
            echo "build_date=${EVENT_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          } >> "$GITHUB_OUTPUT"

      - name: Build app image
        env:
          NEXTCLOUD_VERSION: ${{ needs.meta.outputs.nextcloud_version }}
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
          BUILD_DATE: ${{ steps.params.outputs.build_date }}
        run: |
          set -euo pipefail
          args=(
            --build-arg "NEXTCLOUD_VERSION=${NEXTCLOUD_VERSION}"
            --build-arg "NEXTCLOUD_SOURCE=release"
            --build-arg "VCS_REF=${GITHUB_SHA}"
            --build-arg "BUILD_DATE=${BUILD_DATE}"
            --tag smoke/app
          )
          if [ -n "${NEXTCLOUD_MAJOR}" ]; then
            args+=(--build-arg "NEXTCLOUD_MAJOR=${NEXTCLOUD_MAJOR}")
          fi
          docker build "${args[@]}" .docker/app

      - name: Build web image
        run: docker build --tag smoke/web .docker/web

      - name: Boot the stack and assert it works
        env:
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
        run: |
          set -euo pipefail
          args=(
            --app-image smoke/app
            --web-image smoke/web
            --source release
          )
          if [ -n "${NEXTCLOUD_MAJOR}" ]; then
            args+=(--major "${NEXTCLOUD_MAJOR}")
          fi
          bash tests/smoke-test.sh "${args[@]}"

  verify:
    if: github.event_name == 'pull_request'
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app
            context: .docker/app
          - label: web
            context: .docker/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build arguments
        id: build_args
        env:
          NEXTCLOUD_VERSION: ${{ needs.meta.outputs.nextcloud_version }}
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
          VCS_REF: ${{ github.sha }}
          EVENT_TIMESTAMP: ${{ github.event.pull_request.updated_at }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          build_date="${EVENT_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          if [ "${LABEL}" != "app" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "value<<EOF"
            echo "NEXTCLOUD_VERSION=${NEXTCLOUD_VERSION}"
            echo "NEXTCLOUD_MAJOR=${NEXTCLOUD_MAJOR}"
            echo "VCS_REF=${VCS_REF}"
            echo "BUILD_DATE=${build_date}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and scan runtime image
        uses: ./.github/actions/build-and-scan
        with:
          label: ${{ matrix.label }}
          context: ${{ matrix.context }}
          build-args: ${{ steps.build_args.outputs.value }}

      - name: Save SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.label }}
          path: trivy-results/*.sarif
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app
            context: .docker/app
          - label: web
            context: .docker/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build arguments
        id: build_args
        env:
          NEXTCLOUD_VERSION: ${{ needs.meta.outputs.nextcloud_version }}
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
          VCS_REF: ${{ github.sha }}
          EVENT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          build_date="${EVENT_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          if [ "${LABEL}" != "app" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "value<<EOF"
            echo "NEXTCLOUD_VERSION=${NEXTCLOUD_VERSION}"
            echo "NEXTCLOUD_MAJOR=${NEXTCLOUD_MAJOR}"
            echo "VCS_REF=${VCS_REF}"
            echo "BUILD_DATE=${build_date}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and scan runtime image
        uses: ./.github/actions/build-and-scan
        with:
          label: ${{ matrix.label }}
          context: ${{ matrix.context }}
          build-args: ${{ steps.build_args.outputs.value }}

      - name: Save SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.label }}
          path: trivy-results/*.sarif
          if-no-files-found: warn

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned architecture images
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.meta.outputs.repo_name }}-${{ matrix.label }}
          PREFIX: ${{ needs.meta.outputs.per_arch_prefix }}
        run: |
          set -euo pipefail

          docker tag scan/${{ matrix.label }}:amd64 "${IMAGE}:${PREFIX}-amd64"
          docker tag scan/${{ matrix.label }}:arm64 "${IMAGE}:${PREFIX}-arm64"
          docker push "${IMAGE}:${PREFIX}-amd64"
          docker push "${IMAGE}:${PREFIX}-arm64"

      - name: Publish multi-platform image tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.meta.outputs.repo_name }}-${{ matrix.label }}
          PREFIX: ${{ needs.meta.outputs.per_arch_prefix }}
          IMMUTABLE_TAG: ${{ needs.meta.outputs.immutable_tag }}
          NEXTCLOUD_MAJOR: ${{ needs.meta.outputs.nextcloud_major }}
        run: |
          set -euo pipefail

          set -- "${IMAGE}:latest"
          if [ -n "${NEXTCLOUD_MAJOR}" ]; then
            set -- "$@" "${IMAGE}:nc-${NEXTCLOUD_MAJOR}"
          fi
          if [ -n "${IMMUTABLE_TAG}" ]; then
            set -- "$@" "${IMAGE}:${IMMUTABLE_TAG}"
          fi

          args=()
          for tag in "$@"; do
            args+=(--tag "$tag")
          done

          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${PREFIX}-amd64" \
            "${IMAGE}:${PREFIX}-arm64"

      - name: Collect SARIF reports
        id: sarif
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            if [ -f "trivy-results/${LABEL}-linux-${arch}.sarif" ]; then
              echo "${arch}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${arch}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Upload ${{ matrix.label }} amd64 SARIF to GitHub code scanning
        if: steps.sarif.outputs.amd64 == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/${{ matrix.label }}-linux-amd64.sarif
          category: trivy-${{ matrix.label }}-linux-amd64

      - name: Upload ${{ matrix.label }} arm64 SARIF to GitHub code scanning
        if: steps.sarif.outputs.arm64 == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/${{ matrix.label }}-linux-arm64.sarif
          category: trivy-${{ matrix.label }}-linux-arm64
