version: 2

updates:
  - package-ecosystem: docker
    directory: /.docker/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /.docker/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Dependabot updates the explicit tag and digest in these real base files.
  - package-ecosystem: docker
    directories:
      - /.docker/nextcloud-bases/*
    schedule:
      interval: daily
    ignore:
      - dependency-name: nextcloud
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
