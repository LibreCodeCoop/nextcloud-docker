name: NCDD app tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: phpunit
        type: choice
        options:
          - phpunit
          - behat
      target:
        description: Optional single test target
        required: false
        type: string

permissions:
  contents: read

jobs:
  ncdd:
    uses: LibreCodeCoop/nextcloud-docker/.github/workflows/test-nextcloud-app.yml@80dfe8632a448436ae8c5adb61e845d9e73dcadc # main
    with:
      suite: ${{ inputs.suite || 'phpunit' }}
      target: ${{ inputs.target || '' }}
