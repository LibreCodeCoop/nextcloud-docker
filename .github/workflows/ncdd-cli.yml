name: NCDD CLI

on:
  pull_request:
    paths:
      - 'bin/ncdd'
      - 'lib/ncdd-test.sh'
      - 'tests/ncdd.bats'
      - 'docs/ncdd.md'
      - 'AGENTS.md'
      - 'Makefile'
      - '.github/workflows/ncdd-cli.yml'
      - '.github/workflows/test-nextcloud-app.yml'
      - 'templates/workflows/ncdd-tests.yml'
      - '.github/workflows/test-nextcloud-app.yml'
      - 'templates/workflows/ncdd-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'bin/ncdd'
      - 'lib/ncdd-test.sh'
      - 'tests/ncdd.bats'
      - 'docs/ncdd.md'
      - 'AGENTS.md'
      - 'Makefile'
      - '.github/workflows/ncdd-cli.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR bin/ncdd lib/ncdd-test.sh

      - name: Test
        run: bats tests/ncdd.bats