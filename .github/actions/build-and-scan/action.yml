name: Build, scan, and validate image
description: Build either a Nextcloud FPM runtime or its independent web image
inputs:
  component:
    description: Either app or web
    required: true
  nextcloud_version:
    description: Official Nextcloud release tag for cache keys (e.g. 35.0.2-fpm)
    required: false
    default: ''
  nextcloud_base_image:
    description: Immutable approved Nextcloud image (tag and digest)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Bats
      uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    # Refresh OS security updates: invalidate the app runtime stage and
    # rebuild the small web image so cached apt/apk upgrades cannot go stale.
    - name: Build app image (linux/amd64)
      if: inputs.component == 'app'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .docker/app
        platforms: linux/amd64
        load: true
        build-args: |
          NEXTCLOUD_BASE_IMAGE=${{ inputs.nextcloud_base_image }}
        tags: scan/app:amd64
        no-cache-filters: runtime
        cache-from: type=gha,scope=app-${{ inputs.nextcloud_version }}-amd64
        cache-to: type=gha,mode=max,scope=app-${{ inputs.nextcloud_version }}-amd64

    - name: Build app image (linux/arm64)
      if: inputs.component == 'app'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .docker/app
        platforms: linux/arm64
        load: true
        build-args: |
          NEXTCLOUD_BASE_IMAGE=${{ inputs.nextcloud_base_image }}
        tags: scan/app:arm64
        no-cache-filters: runtime
        cache-from: type=gha,scope=app-${{ inputs.nextcloud_version }}-arm64
        cache-to: type=gha,mode=max,scope=app-${{ inputs.nextcloud_version }}-arm64

    - name: Build web image (linux/amd64)
      if: inputs.component == 'web'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .docker/web
        platforms: linux/amd64
        load: true
        tags: scan/web:amd64
        no-cache: true
        cache-from: type=gha,scope=web-amd64
        cache-to: type=gha,mode=max,scope=web-amd64

    - name: Build web image (linux/arm64)
      if: inputs.component == 'web'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .docker/web
        platforms: linux/arm64
        load: true
        tags: scan/web:arm64
        no-cache: true
        cache-from: type=gha,scope=web-arm64
        cache-to: type=gha,mode=max,scope=web-arm64

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        version: v0.75.0
        cache: true

    - name: Scan app image
      if: inputs.component == 'app'
      shell: bash
      run: |
        bash scripts/scan-images.sh \
          'app@linux/amd64=scan/app:amd64' \
          'app@linux/arm64=scan/app:arm64'

    - name: Scan web image
      if: inputs.component == 'web'
      shell: bash
      run: |
        bash scripts/scan-images.sh \
          'web@linux/amd64=scan/web:amd64' \
          'web@linux/arm64=scan/web:arm64'

    - name: Runtime acceptance app image (linux/amd64)
      if: inputs.component == 'app'
      shell: bash
      env:
        APP_IMAGE: scan/app:amd64
      run: make test-app-image

    - name: Runtime acceptance app image (linux/arm64)
      if: inputs.component == 'app'
      shell: bash
      env:
        APP_IMAGE: scan/app:arm64
      run: make test-app-image

    - name: Runtime acceptance web image (linux/amd64)
      if: inputs.component == 'web'
      shell: bash
      env:
        WEB_IMAGE: scan/web:amd64
      run: make test-web-image
