name: Image Smoke Test

# Builds the app and web images and boots the real stack (postgres + app + web)
# to prove the image actually installs Nextcloud, answers over HTTP and carries
# its traceability labels. A green build only proves an image compiles; this
# proves it boots.
#
# Local equivalent:
#   make smoke-test                 # stable channel
#   make smoke-test DEV=1           # development (daily) channel

on:
  workflow_dispatch:
    inputs:
      source:
        description: Build channel (release or daily)
        required: true
        default: release
        type: choice
        options:
          - release
          - daily
      major:
        description: Nextcloud major to assert (empty for release builds)
        required: false
        default: ''
      base:
        description: Upstream nextcloud image tag used as the base
        required: true
        default: stable-fpm
  pull_request:
    branches:
      - main
    paths:
      - .docker/**
      - tests/**
      - .github/actions/**
      - .github/workflows/image-smoke-test.yml
  push:
    branches:
      - main
    paths:
      - .docker/**
      - tests/**
      - .github/actions/**
      - .github/workflows/image-smoke-test.yml

concurrency:
  group: image-smoke-test-${{ github.event.inputs.source || 'release' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot the stack and assert it works
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_MAJOR: ${{ github.event.inputs.major }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          EVENT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail

          source="${INPUT_SOURCE:-release}"
          base="${INPUT_BASE:-stable-fpm}"
          major="${INPUT_MAJOR:-}"

          # Release builds follow .env.example, the same source of truth the
          # publish workflow uses, so the smoke test never drifts from it.
          if [ "${source}" = "release" ] && [ -z "${INPUT_BASE}" ]; then
            base=$(grep -m1 '^NEXTCLOUD_VERSION=' .env.example | cut -d= -f2-)
            case "$base" in
              [0-9]*) major="${major:-${base%%-*}}" ;;
            esac
          fi

          {
            echo "source=${source}"
            echo "base=${base}"
            echo "major=${major}"
            echo "build_date=${EVENT_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          } >> "$GITHUB_OUTPUT"

      - name: Build app image
        env:
          SOURCE: ${{ steps.params.outputs.source }}
          BASE: ${{ steps.params.outputs.base }}
          MAJOR: ${{ steps.params.outputs.major }}
          BUILD_DATE: ${{ steps.params.outputs.build_date }}
        run: |
          set -euo pipefail
          args=(
            --build-arg "NEXTCLOUD_VERSION=${BASE}"
            --build-arg "NEXTCLOUD_SOURCE=${SOURCE}"
            --build-arg "VCS_REF=${GITHUB_SHA}"
            --build-arg "BUILD_DATE=${BUILD_DATE}"
            --tag smoke/app
          )
          if [ -n "${MAJOR}" ]; then
            args+=(--build-arg "NEXTCLOUD_MAJOR=${MAJOR}")
          fi
          docker build "${args[@]}" .docker/app

      - name: Build web image
        run: docker build --tag smoke/web .docker/web

      - name: Run the smoke test
        env:
          SOURCE: ${{ steps.params.outputs.source }}
          MAJOR: ${{ steps.params.outputs.major }}
        run: |
          set -euo pipefail
          args=(
            --app-image smoke/app
            --web-image smoke/web
            --source "${SOURCE}"
          )
          if [ -n "${MAJOR}" ]; then
            args+=(--major "${MAJOR}")
          fi
          bash tests/smoke-test.sh "${args[@]}"
