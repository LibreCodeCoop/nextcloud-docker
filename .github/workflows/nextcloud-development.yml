name: Validate and publish Nextcloud master image

on:
  pull_request:
    branches:
      - main
    paths:
      - '.docker/app/**'
      - 'tests/app-image.bats'
      - 'scripts/scan-images.sh'
      - 'trivy.yaml'
      - '.github/workflows/nextcloud-development.yml'
      - 'scripts/resolve-nextcloud-upstream.sh'
      - 'scripts/push-master-architecture.sh'
      - 'scripts/publish-master-manifest.sh'
      - 'tests/nextcloud-development-image.bats'
  push:
    branches:
      - main
    paths:
      - '.docker/app/**'
      - 'tests/app-image.bats'
      - 'scripts/scan-images.sh'
      - 'trivy.yaml'
      - '.github/workflows/nextcloud-development.yml'
      - 'scripts/resolve-nextcloud-upstream.sh'
      - 'scripts/push-master-architecture.sh'
      - 'scripts/publish-master-manifest.sh'
      - 'tests/nextcloud-development-image.bats'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextcloud-master-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/librecodecoop/nextcloud-docker-app
  NEXTCLOUD_DAILY_URL: https://download.nextcloud.com/server/daily/latest-master.tar.bz2
  NEXTCLOUD_BASE_TAG: stable-fpm

jobs:
  script-tests:
    name: Test development image scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Test development image scripts
        run: bats tests/nextcloud-development-image.bats

  validate:
    needs:
      - script-tests
    name: master-fpm / linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Resolve upstream inputs
        id: upstream
        shell: bash
        run: bash scripts/resolve-nextcloud-upstream.sh "${NEXTCLOUD_BASE_TAG}" "${NEXTCLOUD_DAILY_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build Nextcloud master app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .docker/app
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            NEXTCLOUD_BASE_IMAGE=${{ steps.upstream.outputs.base_image }}
            NEXTCLOUD_SOURCE=daily
            NEXTCLOUD_DAILY_URL=${{ env.NEXTCLOUD_DAILY_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.upstream.outputs.created }}
            org.opencontainers.image.version=master-fpm
            coop.librecode.nextcloud.channel=master
            coop.librecode.nextcloud.source=${{ env.NEXTCLOUD_DAILY_URL }}
            coop.librecode.nextcloud.source.sha512=${{ steps.upstream.outputs.source_sha512 }}
            coop.librecode.nextcloud.base.digest=${{ steps.upstream.outputs.base_digest }}
            coop.librecode.runtime.variant=fpm
          tags: scan/master:${{ matrix.arch }}
          cache-from: type=gha,scope=master-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=master-${{ matrix.arch }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          cache: true

      - name: Scan Nextcloud master app image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/scan-images.sh "app@linux/${ARCH}=scan/master:${ARCH}"

      - name: Runtime acceptance
        shell: bash
        env:
          APP_IMAGE: scan/master:${{ matrix.arch }}
        run: bats tests/app-image.bats

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated architecture image
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash scripts/push-master-architecture.sh "${APP_IMAGE}" "scan/master:${{ matrix.arch }}" "${GITHUB_SHA}" "${{ matrix.arch }}"

  publish:
    name: Publish master-fpm manifest
    if: github.event_name != 'pull_request'
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform master-fpm
        shell: bash
        run: bash scripts/publish-master-manifest.sh "${APP_IMAGE}" "${GITHUB_SHA}"
