name: Build and scan a runtime image
description: >-
  Build one runtime image for linux/amd64 and linux/arm64 and scan both
  architectures with Trivy. Works for any image defined in this repository,
  so every build channel follows the same build, test and security rules.
inputs:
  label:
    description: Short label used for the scan reports (e.g. app, web, app-dev).
    required: true
  context:
    description: Docker build context. The Dockerfile must be <context>/Dockerfile.
    required: true
  build-args:
    description: Newline separated Docker build arguments.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for linux/amd64
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile
        platforms: linux/amd64
        load: true
        build-args: ${{ inputs.build-args }}
        tags: scan/${{ inputs.label }}:amd64
        cache-from: type=gha,scope=${{ inputs.label }}
        cache-to: type=gha,mode=max,scope=${{ inputs.label }}

    - name: Build image for linux/arm64
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile
        platforms: linux/arm64
        load: true
        build-args: ${{ inputs.build-args }}
        tags: scan/${{ inputs.label }}:arm64
        cache-from: type=gha,scope=${{ inputs.label }}
        cache-to: type=gha,mode=max,scope=${{ inputs.label }}

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        # Keep in sync with the version documented in README.md and
        # docs/images.md. Trivy releases a new minor roughly monthly and its
        # vulnerability DB evolves with it; an outdated scanner is a common
        # cause of opaque scan failures.
        version: v0.75.0
        cache: true

    - name: Scan image
      shell: bash
      run: |
        bash scripts/scan-images.sh \
          '${{ inputs.label }}@linux/amd64=scan/${{ inputs.label }}:amd64' \
          '${{ inputs.label }}@linux/arm64=scan/${{ inputs.label }}:arm64'
