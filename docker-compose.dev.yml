name: ${NCDD_PROJECT_NAME:-ncdd}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NCDD_POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${NCDD_POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NCDD_POSTGRES_PASSWORD:-nextcloud}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NCDD_POSTGRES_USER:-nextcloud} -d ${NCDD_POSTGRES_DB:-nextcloud}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${NCDD_APP_IMAGE:-ghcr.io/librecodecoop/nextcloud-docker-app:35}
    environment:
      POSTGRES_DB: ${NCDD_POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${NCDD_POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NCDD_POSTGRES_PASSWORD:-nextcloud}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NCDD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NCDD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NCDD_TRUSTED_DOMAINS:-localhost 127.0.0.1 web}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nextcloud:/var/www/html
      - ${NCDD_APP_SOURCE:?set NCDD_APP_SOURCE}:${NCDD_APP_PATH:?set NCDD_APP_PATH}

  web:
    build:
      context: .docker/web
    ports:
      - "${NCDD_HTTP_PORT:-8080}:80"
    depends_on:
      - app
    volumes:
      - nextcloud:/var/www/html:ro
      - ${NCDD_APP_SOURCE:?set NCDD_APP_SOURCE}:${NCDD_APP_PATH:?set NCDD_APP_PATH}:ro

  dev-worker:
    image: ${NCDD_DEV_WORKER_IMAGE:-ghcr.io/librecodecoop/nextcloud-docker-dev-worker:35}
    entrypoint: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    working_dir: ${NCDD_APP_PATH:?set NCDD_APP_PATH}
    environment:
      BEHAT_ROOT_DIR: /var/www/html
      BEHAT_RUN_AS: ${NCDD_RUNTIME_USER:-www-data}
      BEHAT_VERBOSE: "1"
    depends_on:
      - app
    volumes:
      - nextcloud:/var/www/html
      - ${NCDD_APP_SOURCE:?set NCDD_APP_SOURCE}:${NCDD_APP_PATH:?set NCDD_APP_PATH}

  node-worker:
    image: node:22-bookworm
    entrypoint: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    working_dir: /workspace/app
    volumes:
      - ${NCDD_APP_SOURCE:?set NCDD_APP_SOURCE}:/workspace/app

volumes:
  db:
  nextcloud: